spring:
  application:
    name: virtual-card-platform

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/virtualcard}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # Replace with your identity provider's issuer URI (Keycloak, Auth0, Cognito, etc.)
          # Spring Boot auto-fetches the JWKS from {issuer-uri}/.well-known/openid-configuration
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:9090/realms/virtual-card}

  # Request size limits — prevent large payload attacks on JSON endpoints
  mvc:
    servlet:
      max-request-header-size: 8KB

server:
  tomcat:
    max-http-form-post-size: 50KB   # max JSON body size — cards/transactions need only a few bytes

  cache:
    # Using Caffeine (in-process). To switch to Redis for multi-instance deployments:
    # type: redis
    # data.redis.host: localhost
    # data.redis.port: 6379
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5s

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# Actuator / Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# Springdoc / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Resilience4j — Circuit Breaker for FraudCheckService
resilience4j:
  circuitbreaker:
    instances:
      fraudCheck:
        sliding-window-size: 10          # evaluate last 10 calls
        failure-rate-threshold: 50       # open circuit if 50% fail
        wait-duration-in-open-state: 30s # wait 30s before half-open
        permitted-calls-in-half-open-state: 3
        slow-call-duration-threshold: 2s # calls > 2s count as failures
        slow-call-rate-threshold: 80

# Application configuration
app:
  security:
    # Allowed CORS origins — override per environment
    # Production: set APP_SECURITY_ALLOWED_ORIGINS=https://your-frontend.com
    allowed-origins:
      - http://localhost:3000
      - http://localhost:8080

  rate-limit:
    capacity: 100           # max tokens in bucket
    refill-tokens: 100      # tokens refilled per window
    refill-seconds: 60      # refill window in seconds
  card:
    default-expiry-months: 36   # cards expire in 3 years by default
    expiry-check-cron: "0 0 * * * *"  # run every hour
  outbox:
    poll-interval-ms: 5000      # poll outbox every 5 seconds
