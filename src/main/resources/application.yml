spring:
  application:
    name: virtual-card-platform

  datasource:
    url: jdbc:postgresql://localhost:5432/virtualcard
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cache:
    # Using Caffeine (in-process). To switch to Redis for multi-instance deployments:
    # type: redis
    # data.redis.host: localhost
    # data.redis.port: 6379
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=5s

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# Actuator / Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# Springdoc / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Application configuration
app:
  rate-limit:
    capacity: 100           # max tokens in bucket
    refill-tokens: 100      # tokens refilled per window
    refill-seconds: 60      # refill window in seconds
  card:
    default-expiry-months: 36   # cards expire in 3 years by default
    expiry-check-cron: "0 0 * * * *"  # run every hour
